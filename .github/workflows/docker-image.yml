name: Uboot Ubuntu CI Build
run-name: Uboot - ${{ inputs.board }} (${{ inputs.soc }})

on:
  workflow_dispatch:
    inputs:
      soc:
        required: true
        description: SOC/CPU Model
        type: string
        default: mt7981
      board:
        required: true
        description: Router Model Name
        type: string
        default: ax3000t
      multi-layout:
        required: true
        description: Enable Multiple Flash Layout Support
        type: choice
        default: '1'
        options:
          - '0'
          - '1'
      runs-on:
        required: true
        description: Runs on...
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-latest

jobs:
  ubuntu-build:
    name: Build on ${{ inputs.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    env:
      # 🔥 修复 Node.js 20 弃用警告
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false  # 减少日志噪音，避免意外报错

      # 🔥 修复依赖安装缺失（解决 exit code 1）
      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            gcc-aarch64-linux-gnu \
            build-essential \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            device-tree-compiler \
            python3-setuptools \
            git \
            wget \
            unzip \
            bc

      # 🔥 给脚本执行权限（99% 报错都是因为这个！）
      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Build U-Boot
        run: ./build.sh
        env:
          SOC: ${{ inputs.soc }}
          BOARD: ${{ inputs.board }}
          MULTI_LAYOUT: ${{ inputs.multi-layout }}

      - uses: actions/upload-artifact@v4
        with:
          name: Uboot - ${{ inputs.board }} (${{ inputs.soc }})
          path: output/*.bin
          if-no-files-found: error  # 构建失败时明确报错，方便排查
