name: Build BL-MT798X AX3000T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: hanwckf/bl-mt798x
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential gcc-aarch64-linux-gnu libssl-dev git bison flex

      - name: Build AX3000T
        run: |
          SOC=mt7981 BOARD=ax3000t MULTI_LAYOUT=1 ./build.sh

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: bl-mt798x-ax3000t
          path: bin/
